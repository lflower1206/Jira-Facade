services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./data/jira-facade.db
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - sqlite_data:/app/data
    command: sh -c "npx prisma generate && npx prisma migrate deploy && exec npx next dev -H 0.0.0.0"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  node_modules:
  next_cache:
  sqlite_data:
